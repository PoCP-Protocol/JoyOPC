services:
  postgres:
    image: postgres:16
    container_name: joyopc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: joyopc
      POSTGRES_PASSWORD: joyopc
      POSTGRES_DB: joyopc
    ports:
      - "5432:5432"
    volumes:
      - joyopc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyopc -d joyopc"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  joyopc_pg:
